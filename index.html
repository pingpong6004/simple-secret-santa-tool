<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Crypto JS for encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: none; }
        .hidden { display: none !important; }
        .result-box { font-size: 1.5rem; font-weight: bold; color: #d63384; }
    </style>
</head>
<body class="py-5">

<div class="container" style="max-width: 600px;">

    <div class="text-center mb-4">
        <h1>💃 Friendmas Secret Santa 🎄</h1>
    </div>

    <!-- VIEW 1: ADMIN (Namen eingeben) -->
    <div id="admin-view" class="card p-4">
        <h4 class="mb-3">Add Participants</h4>

        <div class="input-group mb-3">
            <label for="nameInput"></label><input type="text" id="nameInput" class="form-control" placeholder="Name (e.g. Tim)">
            <button class="btn btn-primary" onclick="addName()">Add</button>
        </div>

        <ul id="nameList" class="list-group mb-4">
            <!-- names appear here -->
        </ul>

        <div class="d-grid gap-2">
            <button class="btn btn-success btn-lg" onclick="generateLinks()" id="generateBtn" disabled>
                🎲 Roll pairs & generate links
            </button>
        </div>

        <!-- resulting links for admin (links to copy) -->
        <div id="linkOutput" class="mt-4 hidden">
            <div class="alert alert-warning">
                <strong>Important:</strong> Copy the links and send them to the designated person.
                You are only allowed to open <u>your own</u> link!
            </div>
            <ul id="linkList" class="list-group list-group-flush"></ul>
        </div>
    </div>

    <!-- VIEW 2: USER (view results) -->
    <div id="user-view" class="card p-4 hidden text-center">
        <h3 class="mb-4">Hey <span id="userNameDisplay" class="text-primary"></span>! 👋</h3>
        <p>You were assigned the following Secret Santa partner:</p>

        <div id="revealSection">
            <button class="btn btn-outline-danger btn-lg px-5 py-3" onclick="revealPartner()">
                🎁 Tap to reveal
            </button>
        </div>

        <div id="partnerResult" class="hidden mt-3">
            <div class="alert alert-success py-4">
                You got <br>
                <span class="result-box" id="targetName">???</span>!
            </div>
            <p class="text-muted small mt-3">Keep this a secret!</p>
        </div>
    </div>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- CONFIGURATION ---
    // this key is used to encrypt the URL parameters
    // everything happens in the client, so it's not super secure, but it's enough for secret santa
    const SECRET_KEY = "Friendmas2025Secret";

    // --- LOGIC ---
    const participants = [];

    // loading check: admin or user?
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const encryptedData = urlParams.get('w'); // 'w' for "Wichtel"-Data (German for Secret Santa)

        if (encryptedData) {
            // USER mode
            showUserView(encryptedData);
        } else {
            // ADMIN mode
            document.getElementById('admin-view').classList.remove('hidden');
        }
    };

    // ADMIN: add name
    function addName() {
        const input = document.getElementById('nameInput');
        const name = input.value.trim();

        if (name && !participants.includes(name)) {
            participants.push(name);
            renderList();
            input.value = '';
            input.focus();
        }
    }

    // ADMIN: render list
    function renderList() {
        const list = document.getElementById('nameList');
        const btn = document.getElementById('generateBtn');

        list.innerHTML = participants.map((p, index) => `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                ${p}
                <button class="btn btn-sm btn-outline-danger" onclick="removeName(${index})">&times;</button>
            </li>
        `).join('');

        // activate button when at least 3 participants (otherwise it wouldnt make sense)
        btn.disabled = participants.length < 3;
    }

    function removeName(index) {
        participants.splice(index, 1);
        renderList();
    }

    // ADMIN: generation (derangement logic)
    function generateLinks() {
        // shuffle list
        let shuffled = [...participants];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        // generate links
        const linksContainer = document.getElementById('linkList');
        linksContainer.innerHTML = '';
        const baseUrl = window.location.origin + window.location.pathname;

        for (let i = 0; i < shuffled.length; i++) {
            const giver = shuffled[i];
            const receiver = shuffled[(i + 1) % shuffled.length]; // next one

            // Payload: JSON String from {giver: "Tim", receiver: "Anna"}
            const payload = JSON.stringify({ g: giver, r: receiver });

            // encrypt
            const encrypted = CryptoJS.AES.encrypt(payload, SECRET_KEY).toString();
            // make URL secure
            const safeEncrypted = encodeURIComponent(encrypted);

            const link = `${baseUrl}?w=${safeEncrypted}`;

            // HTML output
            const li = document.createElement('li');
            li.className = "list-group-item bg-light mb-2 border rounded";
            li.innerHTML = `
                <div class="fw-bold mb-1">Link für ${giver}:</div>
                <div class="input-group input-group-sm">
                    <input type="text" class="form-control" value="${link}" readonly>
                    <button class="btn btn-outline-secondary" onclick="copyToClipboard(this, '${link}')">Copy</button>
                </div>
            `;
            linksContainer.appendChild(li);
        }

        document.getElementById('linkOutput').classList.remove('hidden');
        document.getElementById('generateBtn').classList.add('hidden'); // Verstecken, damit man nicht neu generiert
        document.getElementById('nameInput').disabled = true;
    }

    function copyToClipboard(btn, text) {
        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "Kopiert!";
            btn.classList.replace("btn-outline-secondary", "btn-success");
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace("btn-success", "btn-outline-secondary");
            }, 2000);
        });
    }

    // USER: view logic
    let decryptedData = null;

    function showUserView(encryptedData) {
        document.getElementById('admin-view').classList.add('hidden');
        document.getElementById('user-view').classList.remove('hidden');

        try {
            // decrypt
            const bytes = CryptoJS.AES.decrypt(decodeURIComponent(encryptedData), SECRET_KEY);
            decryptedData = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));

            // show receiver name (failsafe to see if it's the correct link)
            document.getElementById('userNameDisplay').innerText = decryptedData.g;

        } catch (e) {
            alert("Error: Invalid or damaged link!");
            window.location.href = window.location.pathname; // back to start
        }
    }

    function revealPartner() {
        if(decryptedData) {
            document.getElementById('revealSection').classList.add('hidden');
            document.getElementById('partnerResult').classList.remove('hidden');
            document.getElementById('targetName').innerText = decryptedData.r;
        }
    }
</script>

</body>
</html>
